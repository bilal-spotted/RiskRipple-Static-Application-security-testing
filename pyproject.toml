[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-repo-security-scanner"
version = "1.0.0"
description = "Rule-based SAST and repository hygiene scanner for local source code"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Risk Ripple" }]
keywords = ["security", "sast", "static-analysis", "vulnerability-scanner"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "PyYAML>=5.4",
    "Flask>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.scripts]
ai-repo-scanner = "scanner:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "io_utils*", "reports*", "rules*", "prompts*", "webapp*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = "-v -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Ruff formats Python code blocks inside Markdown. Documentation snippets are
# written for readability (aligned trailing comments, elided lines) and are not
# always valid standalone modules, so keep the formatter to real source files.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

# Tests: allow assert in non-pytest style
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# Intentionally vulnerable examples: undefined names (request, cursor, etc.) are deliberate for taint/demo
"samples/*" = ["F821"]
"benchmark/*" = ["F821"]
